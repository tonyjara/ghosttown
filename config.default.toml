# ghosttown default configuration.
#
# Do not edit this file — put your overrides in:
#   ~/.config/ghosttown/config.toml          (or $XDG_CONFIG_HOME/ghosttown/config.toml,
#                                             or point $GHOSTTOWN_CONFIG at any file)
#
# Your file only needs the values you want to change; everything else
# falls back to what you see here. Keybind lists replace the default list
# for that action (they don't append).

[general]
# Command for new surfaces. Empty = $SHELL.
shell = ""
# Session name when `gt` is started without --session.
session = "main"

[notifications]
# Desktop notifications when an agent finishes or blocks in a non-visible tab.
enabled = true
# macOS notification sound name ("" for silent). E.g. Glass, Ping, Submarine.
sound = "Glass"

[keybinds]
# The prefix chord, tmux-style. Press it twice to send it literally.
# Format: modifiers+key, e.g. "ctrl+a", "ctrl+space", "alt+g".
prefix = "ctrl+a"

# Everything below is pressed AFTER the prefix.
# Each action takes a list of keys; any of them triggers it.
"split-right" = ["|", "\\", "%"]
"split-down" = ["-", "\""]
"new-tab" = ["c"]
"next-tab" = ["n"]
"prev-tab" = ["p"]
"close-tab" = ["x"]
"focus-left" = ["h", "left"]
"focus-right" = ["l", "right"]
"focus-up" = ["k", "up"]
"focus-down" = ["j", "down"]
"quit" = ["q"]
"help" = ["?"]
# Tabs 1-9 are always prefix+1 .. prefix+9.
